services:
  # The vector store. A single container: Qdrant needs no etcd or object
  # storage. Data is kept in ./volumes/qdrant so it survives recreates.
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    ports:
      - "6333:6333"   # REST (what wiki-rag uses)
      - "6334:6334"   # gRPC (optional, for other clients)
    # To require an API key, uncomment both this and QDRANT_API_KEY in .env:
    # environment:
    #   QDRANT__SERVICE__API_KEY: "<<<YOUR_QDRANT_API_KEY>>>"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Define the wiki-rag service
  wiki-rag:
    image: ghcr.io/moodlehq/wiki-rag:latest
    container_name: wiki-rag
    volumes:
      - ./data:/app/data
      - ./config.yml:/app/config.yml
      - ./.env:/app/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      LOG_LEVEL: info
    ports:
      - "8081:8080"
    depends_on:
      qdrant:
        condition: service_healthy
